<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast Your Vote — Lourdes College E-Voting</title>
  <meta name="description" content="Cast your vote securely for Lourdes College student elections.">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background: var(--gradient-main); min-height: 100vh; }

    .voter-header {
      background: rgba(6,12,26,0.9);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 50;
    }
    .header-brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      width: 36px; height: 36px; background: var(--gradient-accent);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 1.125rem;
    }
    .brand-text strong { font-size: 0.9375rem; font-weight: 700; }
    .brand-text span { font-size: 0.75rem; color: var(--text-muted); display: block; }

    .header-user { display: flex; align-items: center; gap: 0.75rem; }
    .user-name { font-size: 0.875rem; font-weight: 600; }
    .user-id { font-size: 0.75rem; color: var(--text-muted); }

    .voter-main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 6rem; }

    .election-banner {
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-xl);
      padding: 2rem;
      margin-bottom: 2rem;
      position: relative; overflow: hidden;
    }
    .election-banner::after {
      content: '🗳️';
      position: absolute; right: 1.5rem; top: 50%; transform: translateY(-50%);
      font-size: 4rem; opacity: 0.15;
    }
    .election-banner h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .election-banner p { color: var(--text-secondary); font-size: 0.9375rem; max-width: 600px; }
    .election-meta { display: flex; gap: 1.5rem; margin-top: 1rem; flex-wrap: wrap; }
    .election-meta-item { font-size: 0.8125rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.4rem; }

    .progress-bar-section {
      background: var(--gradient-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      display: flex; align-items: center; gap: 1.5rem;
    }
    .progress-info { flex: 1; }
    .progress-label { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
    .progress-sub { font-size: 0.8125rem; color: var(--text-muted); }
    .progress-track { height: 8px; background: rgba(255,255,255,0.06); border-radius: 100px; overflow: hidden; flex: 1; min-width: 120px; }
    .progress-fill { height: 100%; border-radius: 100px; background: var(--gradient-accent); transition: width 0.5s ease; }
    .progress-pct { font-size: 1rem; font-weight: 700; color: var(--accent); min-width: 40px; text-align: right; }

    .submit-section {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(6,12,26,0.95);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      z-index: 50;
    }
    .submit-info { font-size: 0.875rem; color: var(--text-secondary); }
    .submit-info strong { color: var(--text-primary); }

    /* Thank you state */
    .thankyou {
      text-align: center; padding: 4rem 2rem;
      animation: fadeIn 0.5s ease;
    }
    .thankyou-icon { font-size: 5rem; margin-bottom: 1.5rem; animation: bounceIn 0.6s ease; }
    @keyframes bounceIn {
      0% { transform: scale(0); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .thankyou h2 { font-size: 2rem; font-weight: 800; margin-bottom: 0.75rem; }
    .thankyou p { color: var(--text-secondary); font-size: 1rem; max-width: 500px; margin: 0 auto 2rem; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .no-election {
      text-align: center; padding: 5rem 2rem;
    }
    .no-election-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }

    .loading-skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
      height: 24px; margin-bottom: 0.5rem;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <header class="voter-header">
    <div class="header-brand">
      <div class="brand-icon">🗳️</div>
      <div class="brand-text">
        <strong>Lourdes College</strong>
        <span>E-Voting System</span>
      </div>
    </div>
    <div class="header-user" id="header-user">
      <div>
        <div class="user-name" id="user-name">—</div>
        <div class="user-id" id="user-id">—</div>
      </div>
      <div class="user-avatar" id="user-avatar" style="width:36px;height:36px;border-radius:50%;background:var(--gradient-accent);display:flex;align-items:center;justify-content:center;font-size:0.875rem;font-weight:700;color:white;flex-shrink:0;"></div>
      <a href="/voter/results.html" class="btn btn-outline btn-sm">📊 Results</a>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sign Out</button>
    </div>
  </header>

  <main class="voter-main" id="main-content">
    <!-- Dynamic content -->
  </main>

  <div class="submit-section" id="submit-section" style="display:none;">
    <div class="submit-info">
      Selected <strong id="selected-count">0</strong> of <strong id="total-positions">0</strong> positions
    </div>
    <button class="btn btn-primary btn-lg" id="submit-vote-btn" disabled>
      🗳️ Cast My Vote
    </button>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let currentUser = null;
    let currentElection = null;
    let selections = {}; // positionId → candidateId
    let totalPositions = 0;
    let alreadyVoted = false;

    async function init() {
      currentUser = await requireAuth('/');
      if (!currentUser) return;

      // Set header user info
      document.getElementById('user-name').textContent = currentUser.name;
      document.getElementById('user-id').textContent = currentUser.student_id;
      document.getElementById('user-avatar').textContent = getInitials(currentUser.name);

      document.getElementById('logout-btn').addEventListener('click', logout);

      await loadBallot();
    }

    async function loadBallot() {
      const main = document.getElementById('main-content');
      main.innerHTML = `<div style="padding:3rem;text-align:center;color:var(--text-muted);">Loading ballot…</div>`;

      try {
        const data = await apiGet('/vote/active');

        if (!data.election) {
          main.innerHTML = `
            <div class="no-election">
              <div class="no-election-icon">📭</div>
              <h2>No Active Election</h2>
              <p style="color:var(--text-secondary);margin-top:0.5rem">There are no elections open for voting at this time. Check back later.</p>
            </div>
          `;
          return;
        }

        currentElection = data.election;
        const votedPositions = data.votedPositions || {};
        const votedCount = Object.keys(votedPositions).length;
        totalPositions = currentElection.positions.length;

        // Check if fully voted
        if (votedCount > 0 && votedCount === totalPositions) {
          alreadyVoted = true;
          showThankYou();
          return;
        }

        // Pre-fill already voted positions
        for (const [posId, candId] of Object.entries(votedPositions)) {
          selections[posId] = candId;
        }

        renderBallot();
      } catch (err) {
        main.innerHTML = `<div style="padding:3rem;text-align:center;color:var(--danger);">Error: ${err.message}</div>`;
      }
    }

    function renderBallot() {
      const main = document.getElementById('main-content');
      const positions = currentElection.positions;

      let html = `
        <div class="election-banner">
          <span class="badge badge-active badge-dot mb-1">Active Election</span>
          <h1>${currentElection.title}</h1>
          ${currentElection.description ? `<p>${currentElection.description}</p>` : ''}
          <div class="election-meta">
            <span class="election-meta-item">📋 ${positions.length} Position${positions.length !== 1 ? 's' : ''}</span>
            ${currentElection.end_at ? `<span class="election-meta-item">⏰ Ends: ${formatDate(currentElection.end_at)}</span>` : ''}
          </div>
        </div>

        <div class="progress-bar-section">
          <div class="progress-info">
            <div class="progress-label">Your Ballot Progress</div>
            <div class="progress-sub" id="progress-sub">Select a candidate for each position</div>
          </div>
          <div class="progress-track" style="flex:1;min-width:150px;">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
          <div class="progress-pct" id="progress-pct">0%</div>
        </div>
      `;

      positions.forEach((pos, idx) => {
        html += `
          <div class="position-section" id="pos-section-${pos.id}">
            <div class="position-header">
              <div class="position-number">${idx + 1}</div>
              <div>
                <div class="position-title">${pos.title}</div>
                <div class="position-subtitle">Choose 1 candidate</div>
              </div>
            </div>
            <div class="candidate-grid">
              ${pos.candidates.length === 0
                ? `<p style="color:var(--text-muted);font-size:0.875rem;">No candidates registered for this position.</p>`
                : pos.candidates.map(c => renderCandidateCard(c, pos.id)).join('')
              }
            </div>
          </div>
        `;
      });

      main.innerHTML = html;

      // Show submit bar
      document.getElementById('submit-section').style.display = 'flex';
      document.getElementById('total-positions').textContent = positions.length;

      // Bind card clicks
      document.querySelectorAll('.candidate-card').forEach(card => {
        card.addEventListener('click', () => {
          const posId = card.dataset.positionId;
          const candId = card.dataset.candidateId;
          selectCandidate(posId, candId);
        });
      });

      // Restore previous selections
      for (const [posId, candId] of Object.entries(selections)) {
        highlightCard(posId, candId);
      }

      updateProgress();
      document.getElementById('submit-vote-btn').addEventListener('click', confirmSubmit);
    }

    function renderCandidateCard(candidate, positionId) {
      const photoHtml = candidate.photo_url
        ? `<img src="${candidate.photo_url}" alt="${candidate.name}" class="candidate-photo">`
        : `<div class="candidate-photo-placeholder">${getInitials(candidate.name)}</div>`;

      return `
        <div class="candidate-card" data-position-id="${positionId}" data-candidate-id="${candidate.id}" id="card-${positionId}-${candidate.id}">
          <div class="candidate-check">✓</div>
          ${photoHtml}
          <div class="candidate-name">${candidate.name}</div>
          ${candidate.party ? `<div class="candidate-party">${candidate.party}</div>` : ''}
          ${candidate.bio ? `<div class="candidate-party" style="margin-top:0.35rem;font-size:0.7rem;line-height:1.4;">${candidate.bio}</div>` : ''}
        </div>
      `;
    }

    function selectCandidate(positionId, candidateId) {
      // Deselect previous in same position
      const prev = selections[positionId];
      if (prev) {
        const prevCard = document.getElementById(`card-${positionId}-${prev}`);
        if (prevCard) prevCard.classList.remove('selected');
      }

      // Select new
      selections[positionId] = candidateId;
      highlightCard(positionId, candidateId);
      updateProgress();
    }

    function highlightCard(positionId, candidateId) {
      const card = document.getElementById(`card-${positionId}-${candidateId}`);
      if (card) card.classList.add('selected');
    }

    function updateProgress() {
      const selected = Object.keys(selections).length;
      const pct = totalPositions > 0 ? Math.round((selected / totalPositions) * 100) : 0;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-pct').textContent = pct + '%';
      document.getElementById('selected-count').textContent = selected;
      document.getElementById('progress-sub').textContent =
        selected === totalPositions ? '✅ All positions selected. Ready to submit!' : `Select a candidate for each position`;

      const btn = document.getElementById('submit-vote-btn');
      btn.disabled = selected < totalPositions;
    }

    function confirmSubmit() {
      showConfirm(
        `You are about to cast your vote. <strong>This action cannot be undone.</strong><br><br>Make sure you've selected the right candidates before confirming.`,
        submitVotes,
        'Confirm Your Vote'
      );
    }

    async function submitVotes() {
      const btn = document.getElementById('submit-vote-btn');
      btn.disabled = true;
      btn.classList.add('btn-loading');
      btn.textContent = 'Submitting…';

      const votes = Object.entries(selections).map(([positionId, candidateId]) => ({
        position_id: parseInt(positionId),
        candidate_id: parseInt(candidateId)
      }));

      try {
        await apiPost('/vote/cast', { election_id: currentElection.id, votes });
        showThankYou();
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = '🗳️ Cast My Vote';
      }
    }

    function showThankYou() {
      document.getElementById('submit-section').style.display = 'none';
      document.getElementById('main-content').innerHTML = `
        <div class="thankyou">
          <div class="thankyou-icon">✅</div>
          <h2>Vote Cast Successfully!</h2>
          <p>Thank you, <strong>${currentUser.name}</strong>! Your vote has been securely recorded. Your participation makes a difference.</p>
          <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
            <a href="/voter/results.html" class="btn btn-primary btn-lg">📊 View Live Results</a>
            <button class="btn btn-outline btn-lg" onclick="logout()">Sign Out</button>
          </div>
        </div>
      `;
    }

    init();
  </script>
</body>
</html>
