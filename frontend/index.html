<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lourdes College E-Voting System</title>
  <meta name="description"
    content="Official Electronic Voting System for Lourdes College Counseling Department — Secure, transparent, and accessible.">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body.login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
  </style>
</head>

<body class="login-page">
  <!-- Aurora background -->
  <div class="aurora-bg">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <!-- Logo Section -->
      <div class="logo">
        <div class="logo-icon">🗳️</div>
        <h1>Lourdes College</h1>
        <p>Counseling Department E-Voting System</p>
      </div>

      <!-- Error Message -->
      <div class="error-msg" id="error-msg"></div>

      <!-- Login Form -->
      <form id="login-form" autocomplete="off">
        <!-- Student ID Field -->
        <div class="form-group">
          <label class="form-label" for="student_id">Student ID</label>
          <div class="input-group">
            <span class="input-icon">🎓</span>
            <input 
              type="text" 
              id="student_id" 
              name="student_id" 
              class="form-control"
              placeholder="Enter your Student ID" 
              autocomplete="username" 
              required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="pw-wrap input-group">
            <span class="input-icon">🔒</span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="Enter your password"
              autocomplete="current-password" 
              required>
            <button 
              type="button" 
              class="pw-toggle input-group-right" 
              id="pw-toggle"
              aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-login" id="login-btn">
          <span>Sign In</span>
          <span>→</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider-or">secure &amp; encrypted</div>

      <!-- Footer Info -->
      <div class="footer-info">
        <p>🔐 Your vote is <strong>anonymous</strong> and <strong>secured</strong></p>
        <p>For account issues, contact your administrator</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    (async () => {
      try {
        const data = await apiGet('/auth/me');
        if (data.user.role === 'admin') window.location.href = '/admin/dashboard.html';
        else window.location.href = '/voter/dashboard.html';
      } catch {
        // Not logged in, stay on page
      }
    })();

    // Password visibility toggle
    const pwToggleBtn = document.getElementById('pw-toggle');
    const pwInput = document.getElementById('password');

    pwToggleBtn.addEventListener('click', function (e) {
      e.preventDefault();
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        this.textContent = '🙈';
        this.setAttribute('aria-label', 'Hide password');
      } else {
        pwInput.type = 'password';
        this.textContent = '👁️';
        this.setAttribute('aria-label', 'Show password');
      }
    });

    // Login form submission
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const student_id = document.getElementById('student_id').value.trim();
      const password = document.getElementById('password').value;

      // Clear previous error
      errorMsg.classList.remove('show', 'shake');

      // Validate inputs
      if (!student_id || !password) {
        errorMsg.textContent = 'Please enter both Student ID and Password';
        errorMsg.classList.add('show', 'shake');
        return;
      }

      // Disable button and show loading state
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span>Signing in…</span>';

      try {
        const data = await apiPost('/auth/login', { student_id, password });
        
        // Redirect based on role
        if (data.user.role === 'admin') {
          window.location.href = '/admin/dashboard.html';
        } else {
          window.location.href = '/voter/dashboard.html';
        }
      } catch (err) {
        // Show error message
        errorMsg.textContent = err.message || 'Login failed. Please try again.';
        errorMsg.classList.add('show', 'shake');

        // Reset button
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Sign In</span><span>→</span>';

        // Clear password field on error
        pwInput.value = '';
        pwInput.type = 'password';
        pwToggleBtn.textContent = '👁️';
      }
    });
  </script>
</body>

</html>
