<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidates — Lourdes College E-Voting Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .admin-candidate-card {
      background: var(--gradient-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex; align-items: center; gap: 1rem;
      transition: var(--transition);
    }
    .admin-candidate-card:hover { border-color: var(--border-accent); }
    .admin-cand-photo {
      width: 56px; height: 56px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--border); flex-shrink: 0;
    }
    .admin-cand-placeholder {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--gradient-accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.125rem; font-weight: 700; color: white;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="bg-animated"></div>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">🗳️</div>
      <div class="sidebar-brand-text"><strong>E-Voting Admin</strong><span>Lourdes College</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <a href="/admin/dashboard.html" class="nav-item"><span class="nav-item-icon">📊</span> Dashboard</a>
      <div class="nav-section-label">Management</div>
      <a href="/admin/elections.html" class="nav-item"><span class="nav-item-icon">🗓️</span> Elections</a>
      <a href="/admin/candidates.html" class="nav-item active"><span class="nav-item-icon">👤</span> Candidates</a>
      <a href="/admin/voters.html" class="nav-item"><span class="nav-item-icon">🎓</span> Voters</a>
      <div class="nav-section-label">Reports</div>
      <a href="/admin/audit.html" class="nav-item"><span class="nav-item-icon">📋</span> Audit Log</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="admin-avatar"></div>
        <div class="user-info"><strong id="admin-name">—</strong><span id="admin-id">—</span></div>
      </div>
      <button class="btn btn-outline btn-sm" style="width:100%;margin-top:0.5rem;" id="logout-btn">Sign Out</button>
    </div>
  </aside>

  <div class="main-content">
    <header class="main-header">
      <div><div class="page-title">Candidates</div><div class="page-subtitle">Manage candidates per position</div></div>
      <button class="btn btn-primary" id="add-candidate-btn" style="display:none;">+ Add Candidate</button>
    </header>
    <main class="main-body">
      <!-- Filters -->
      <div class="card mb-3">
        <div class="card-body" style="display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:200px;">
            <label class="form-label">Election</label>
            <select class="form-control" id="filter-election">
              <option value="">Select an election…</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;min-width:200px;">
            <label class="form-label">Position</label>
            <select class="form-control" id="filter-position" disabled>
              <option value="">Select a position…</option>
            </select>
          </div>
        </div>
      </div>

      <div id="candidates-content">
        <div class="empty-state"><div class="empty-state-icon">👤</div><h3>Select a Position</h3><p>Choose an election and position above to view and manage candidates.</p></div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Candidate Modal -->
<div class="modal-overlay" id="candidate-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="candidate-modal-title">Add Candidate</h3>
      <button class="btn btn-ghost btn-icon" onclick="closeModal('candidate-modal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="candidate-form" enctype="multipart/form-data">
        <input type="hidden" id="candidate-id">
        <div style="display:flex;gap:1rem;align-items:flex-start;margin-bottom:1.25rem;">
          <div id="photo-preview-wrap" style="flex-shrink:0;">
            <div id="photo-placeholder" style="width:80px;height:80px;border-radius:50%;background:var(--gradient-accent);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:white;">👤</div>
            <img id="photo-preview" src="" alt="" style="display:none;width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--border);">
          </div>
          <div style="flex:1;">
            <label class="form-label">Photo (optional)</label>
            <input type="file" class="form-control" id="candidate-photo" accept="image/*" style="padding:0.5rem;">
          </div>
        </div>
        <div class="form-group mb-2">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-control" id="candidate-name" placeholder="Candidate's full name" required>
        </div>
        <div class="form-group mb-2">
          <label class="form-label">Party / Affiliation</label>
          <input type="text" class="form-control" id="candidate-party" placeholder="e.g. Student Alliance, Independent…">
        </div>
        <div class="form-group mb-2">
          <label class="form-label">Short Bio</label>
          <textarea class="form-control" id="candidate-bio" placeholder="Brief background (optional)…" rows="3"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('candidate-modal')">Cancel</button>
      <button class="btn btn-primary" id="candidate-save-btn">Save Candidate</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let selectedElectionId = null;
  let selectedPositionId = null;

  async function init() {
    const user = await requireAdminAuth();
    if (!user) return;
    document.getElementById('admin-name').textContent = user.name;
    document.getElementById('admin-id').textContent = user.student_id;
    document.getElementById('admin-avatar').textContent = getInitials(user.name);
    document.getElementById('logout-btn').addEventListener('click', logout);

    // Load elections into filter
    const elections = await apiGet('/admin/elections');
    const sel = document.getElementById('filter-election');
    elections.forEach(e => {
      const opt = document.createElement('option');
      opt.value = e.id; opt.textContent = e.title;
      sel.appendChild(opt);
    });

    sel.addEventListener('change', async () => {
      selectedElectionId = sel.value || null;
      selectedPositionId = null;
      const posSelect = document.getElementById('filter-position');
      posSelect.innerHTML = '<option value="">Select a position…</option>';
      posSelect.disabled = !selectedElectionId;
      document.getElementById('add-candidate-btn').style.display = 'none';
      document.getElementById('candidates-content').innerHTML = `<div class="empty-state"><div class="empty-state-icon">👤</div><h3>Select a Position</h3></div>`;

      if (selectedElectionId) {
        const positions = await apiGet(`/admin/positions?electionId=${selectedElectionId}`);
        positions.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id; opt.textContent = p.title;
          posSelect.appendChild(opt);
        });
      }
    });

    document.getElementById('filter-position').addEventListener('change', async (e) => {
      selectedPositionId = e.target.value || null;
      document.getElementById('add-candidate-btn').style.display = selectedPositionId ? 'inline-flex' : 'none';
      if (selectedPositionId) await loadCandidates();
    });

    document.getElementById('add-candidate-btn').addEventListener('click', () => openCandidateModal(null));
    document.getElementById('candidate-save-btn').addEventListener('click', saveCandidate);

    // Photo preview
    document.getElementById('candidate-photo').addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('photo-preview').src = e.target.result;
          document.getElementById('photo-preview').style.display = 'block';
          document.getElementById('photo-placeholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });
  }

  async function loadCandidates() {
    const container = document.getElementById('candidates-content');
    try {
      const candidates = await apiGet(`/admin/candidates?positionId=${selectedPositionId}`);
      if (!candidates.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">👤</div><h3>No Candidates Yet</h3><p>Add the first candidate for this position.</p><button class="btn btn-primary" onclick="openCandidateModal(null)">+ Add Candidate</button></div>`;
        return;
      }
      container.innerHTML = `<div style="display:flex;flex-direction:column;gap:0.75rem;">` + candidates.map(c => `
        <div class="admin-candidate-card">
          ${c.photo_url
            ? `<img src="${c.photo_url}" class="admin-cand-photo" alt="${c.name}">`
            : `<div class="admin-cand-placeholder">${getInitials(c.name)}</div>`
          }
          <div style="flex:1;min-width:0;">
            <div style="font-size:1rem;font-weight:700;">${c.name}</div>
            ${c.party ? `<div style="font-size:0.8125rem;color:var(--accent);">${c.party}</div>` : ''}
            ${c.bio ? `<div style="font-size:0.8125rem;color:var(--text-muted);margin-top:0.25rem;">${c.bio}</div>` : ''}
          </div>
          <div style="display:flex;gap:0.5rem;flex-shrink:0;">
            <button class="btn btn-outline btn-sm" onclick="openCandidateModal(${c.id})">✏️ Edit</button>
            <button class="btn btn-ghost btn-sm btn-icon" onclick="deleteCandidate(${c.id})" style="color:var(--danger);">🗑️</button>
          </div>
        </div>
      `).join('') + `</div>`;

      // Store candidates for edit modal
      window._candidates = candidates;
    } catch (err) { showToast(err.message, 'error'); }
  }

  function openCandidateModal(id) {
    const c = id ? (window._candidates || []).find(x => x.id === id) : null;
    document.getElementById('candidate-modal-title').textContent = c ? 'Edit Candidate' : 'Add Candidate';
    document.getElementById('candidate-id').value = c ? c.id : '';
    document.getElementById('candidate-name').value = c ? c.name : '';
    document.getElementById('candidate-party').value = c ? (c.party || '') : '';
    document.getElementById('candidate-bio').value = c ? (c.bio || '') : '';
    document.getElementById('candidate-photo').value = '';

    const preview = document.getElementById('photo-preview');
    const placeholder = document.getElementById('photo-placeholder');
    if (c && c.photo_url) {
      preview.src = c.photo_url; preview.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      preview.style.display = 'none';
      placeholder.style.display = 'flex';
    }

    document.getElementById('candidate-modal').classList.add('open');
  }

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  async function saveCandidate() {
    const btn = document.getElementById('candidate-save-btn');
    const id = document.getElementById('candidate-id').value;
    const name = document.getElementById('candidate-name').value.trim();
    if (!name) return showToast('Name is required', 'error');

    const formData = new FormData();
    formData.append('position_id', selectedPositionId);
    formData.append('name', name);
    formData.append('party', document.getElementById('candidate-party').value.trim());
    formData.append('bio', document.getElementById('candidate-bio').value.trim());
    const photoFile = document.getElementById('candidate-photo').files[0];
    if (photoFile) formData.append('photo', photoFile);

    btn.disabled = true;
    try {
      if (id) await apiPutForm(`/admin/candidates/${id}`, formData);
      else await apiPostForm('/admin/candidates', formData);
      showToast(`Candidate ${id ? 'updated' : 'added'}!`, 'success');
      closeModal('candidate-modal');
      await loadCandidates();
    } catch (err) { showToast(err.message, 'error'); }
    btn.disabled = false;
  }

  async function deleteCandidate(id) {
    showConfirm('Delete this candidate? This cannot be undone.', async () => {
      try {
        await apiDelete(`/admin/candidates/${id}`);
        showToast('Candidate deleted', 'info');
        await loadCandidates();
      } catch (err) { showToast(err.message, 'error'); }
    });
  }

  init();
</script>
</body>
</html>
